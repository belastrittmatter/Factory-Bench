<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 585" width="722" height="585" role="img" aria-label="FactoryBench architecture: who handles what"><style>
svg{--foreground:#1d1d1f;--muted:#5f6368;--background:#ffffff;--card:#f4f4f5;--border:#c9c9cf;
--chart-1:#3b6fe0;--chart-2:#17a2a2;--chart-3:#d99a06;--chart-4:#8b5cf6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){svg{--foreground:#ececef;--muted:#a1a1aa;--background:#0d1117;--card:#1b1f27;--border:#3a3f4b}}
.bg{fill:var(--background)}
text{fill:var(--foreground)}
.b{font-size:12px;font-weight:600}.s{font-size:10.5px;fill:var(--muted)}
.lb{font-size:10.5px;fill:var(--foreground);paint-order:stroke;stroke:var(--background);stroke-width:4px;stroke-linejoin:round}
.zt{font-size:11px;font-weight:600;fill:var(--muted);letter-spacing:.02em}
.zone{fill:none;stroke:var(--border);stroke-dasharray:3 3}
.ln{fill:none;stroke:var(--muted);stroke-width:1.3}.ds{stroke-dasharray:5 4}
.ahd{fill:var(--muted)}
.p0{fill:var(--card);stroke:var(--border)}
.p1{fill:color-mix(in srgb,var(--chart-1) 18%,var(--background));stroke:var(--chart-1)}
.p2{fill:color-mix(in srgb,var(--chart-2) 18%,var(--background));stroke:var(--chart-2)}
.p3{fill:color-mix(in srgb,var(--chart-3) 18%,var(--background));stroke:var(--chart-3)}
.p4{fill:color-mix(in srgb,var(--chart-4) 18%,var(--background));stroke:var(--chart-4)}
.life{stroke:var(--border);stroke-dasharray:2 3}
.grp{fill:none;stroke:var(--border)}.gl{stroke:var(--border);stroke-dasharray:4 3}
.gk{font-size:10.5px;font-weight:600;fill:var(--muted)}
.note{fill:color-mix(in srgb,var(--chart-4) 18%,var(--background));stroke:var(--chart-4)}
.th{font-size:12px;font-weight:700}.tc{font-size:10.5px;font-family:ui-monospace,Menlo,monospace}
.tt{font-size:10px;fill:var(--muted);font-family:ui-monospace,Menlo,monospace}
.pk{fill:var(--chart-3);font-size:10px;font-weight:700}.fk{fill:var(--chart-1);font-size:10px;font-weight:700}
.sep{stroke:var(--border)}
.lg{font-size:11px;fill:var(--muted)}
</style><rect class="bg" width="722" height="585"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahd"/></marker></defs><rect x="8" y="7" width="10" height="10" rx="2" class="p1"/><text x="23" y="16" class="lg">People</text><rect x="78.2" y="7" width="10" height="10" rx="2" class="p2"/><text x="93.2" y="16" class="lg">Factory</text><rect x="154.6" y="7" width="10" height="10" rx="2" class="p3"/><text x="169.6" y="16" class="lg">Product CI</text><rect x="249.6" y="7" width="10" height="10" rx="2" class="p4"/><text x="264.6" y="16" class="lg">FactoryBench</text><text x="357.0" y="16" class="lg">── work / control</text><text x="480.4" y="16" class="lg">- - - observation only</text><rect x="0" y="130" width="210" height="300" rx="10" class="zone"/><text x="10" y="148" class="zt">Factory · e.g. plan → build loop</text><rect x="250" y="130" width="220" height="255" rx="10" class="zone"/><text x="260" y="148" class="zt">Product repo · GitHub + CI</text><rect x="510" y="130" width="210" height="450" rx="10" class="zone"/><text x="520" y="148" class="zt">FactoryBench · passive</text><rect x="15" y="45" width="180" height="52" rx="6" class="p1"/><text x="105.0" y="68.0" text-anchor="middle" class="b">Factory maintainers</text><text x="105.0" y="82.0" text-anchor="middle" class="s">one factory each</text><rect x="265" y="45" width="190" height="52" rx="6" class="p1"/><text x="360.0" y="61.0" text-anchor="middle" class="b">Humans</text><text x="360.0" y="75.0" text-anchor="middle" class="s">file issues, approve plans,</text><text x="360.0" y="89.0" text-anchor="middle" class="s">review, merge</text><rect x="525" y="45" width="180" height="52" rx="6" class="p1"/><text x="615.0" y="68.0" text-anchor="middle" class="b">FactoryBench operator</text><text x="615.0" y="82.0" text-anchor="middle" class="s">runs FactoryBench</text><path d="M105,97 L105,128" class="ln" marker-end="url(#ah)"/><text x="111" y="116" text-anchor="start" class="lb">own</text><path d="M360,97 L360,163" class="ln" marker-end="url(#ah)"/><text x="354" y="118" text-anchor="end" class="lb">issues, approve, merge</text><path d="M615,97 L615,128" class="ln" marker-end="url(#ah)"/><text x="621" y="116" text-anchor="start" class="lb">owns</text><rect x="15" y="165" width="180" height="40" rx="6" class="p2"/><text x="105.0" y="182.0" text-anchor="middle" class="b">watch / run</text><text x="105.0" y="196.0" text-anchor="middle" class="s">claims labelled issues</text><rect x="15" y="225" width="180" height="70" rx="6" class="p2"/><text x="105.0" y="250.0" text-anchor="middle" class="b">loop: red → plan → green</text><text x="105.0" y="264.0" text-anchor="middle" class="s">gate ladder: build, guard,</text><text x="105.0" y="278.0" text-anchor="middle" class="s">test</text><rect x="60" y="315" width="135" height="36" rx="6" class="p2"/><text x="127.5" y="330.0" text-anchor="middle" class="b">agent sessions</text><text x="127.5" y="344.0" text-anchor="middle" class="s">e.g. Claude Code</text><rect x="15" y="371" width="180" height="44" rx="6" class="p2"/><text x="105.0" y="390.0" text-anchor="middle" class="b">emitter</text><text x="105.0" y="404.0" text-anchor="middle" class="s">~5 call sites, raw facts</text><path d="M105,205 L105,223" class="ln" marker-end="url(#ah)"/><path d="M128,295 L128,313" class="ln" marker-end="url(#ah)"/><path d="M35,295 L35,369" class="ln ds" marker-end="url(#ah)"/><rect x="265" y="165" width="150" height="36" rx="6" class="p0"/><text x="340.0" y="187.0" text-anchor="middle" class="b">Issues + labels</text><rect x="265" y="221" width="150" height="36" rx="6" class="p0"/><text x="340.0" y="243.0" text-anchor="middle" class="b">Pull requests</text><rect x="265" y="277" width="150" height="40" rx="6" class="p3"/><text x="340.0" y="294.0" text-anchor="middle" class="b">CI</text><text x="340.0" y="308.0" text-anchor="middle" class="s">build, test, lint</text><rect x="265" y="337" width="150" height="34" rx="6" class="p0"/><text x="340.0" y="358.0" text-anchor="middle" class="b">Check runs</text><path d="M265,183 L197,183" class="ln" marker-end="url(#ah)"/><text x="231" y="177" text-anchor="middle" class="lb">poll</text><path d="M197,244 L263,244" class="ln" marker-end="url(#ah)"/><text x="231" y="238" text-anchor="middle" class="lb">push, PR</text><path d="M340,257 L340,275" class="ln" marker-end="url(#ah)"/><path d="M340,317 L340,335" class="ln" marker-end="url(#ah)"/><rect x="525" y="165" width="180" height="46" rx="6" class="p4"/><text x="615.0" y="185.0" text-anchor="middle" class="b">GitHub poller</text><text x="615.0" y="199.0" text-anchor="middle" class="s">API, every 2–5 min</text><rect x="525" y="241" width="180" height="34" rx="6" class="p4"/><text x="615.0" y="262.0" text-anchor="middle" class="b">raw events (kept)</text><rect x="525" y="295" width="180" height="40" rx="6" class="p4"/><text x="615.0" y="312.0" text-anchor="middle" class="b">normalize</text><text x="615.0" y="326.0" text-anchor="middle" class="s">pure, replayable</text><rect x="525" y="355" width="180" height="34" rx="6" class="p4"/><text x="615.0" y="376.0" text-anchor="middle" class="b">SQLite: items, attempts</text><rect x="525" y="409" width="180" height="50" rx="6" class="p4"/><text x="615.0" y="431.0" text-anchor="middle" class="b">reports</text><text x="615.0" y="445.0" text-anchor="middle" class="s">live · item · items · factories</text><rect x="525" y="480" width="180" height="40" rx="6" class="p4"/><text x="615.0" y="497.0" text-anchor="middle" class="b">POST /v1/logs</text><text x="615.0" y="511.0" text-anchor="middle" class="s">OTLP, Claude Code only</text><rect x="525" y="535" width="180" height="36" rx="6" class="p4"/><text x="615.0" y="557.0" text-anchor="middle" class="b">POST /v1/events</text><path d="M472,188 L523,188" class="ln ds" marker-end="url(#ah)"/><text x="497" y="180" text-anchor="middle" class="lb">API poll</text><path d="M615,211 L615,239" class="ln" marker-end="url(#ah)"/><path d="M615,275 L615,293" class="ln" marker-end="url(#ah)"/><path d="M615,335 L615,353" class="ln" marker-end="url(#ah)"/><path d="M615,389 L615,407" class="ln" marker-end="url(#ah)"/><path d="M705,500 L714,500" class="ln"/><path d="M705,553 L714,553 L714,258 L707,258" class="ln" marker-end="url(#ah)"/><path d="M195,333 L222,333 L222,500 L523,500" class="ln ds" marker-end="url(#ah)"/><text x="372" y="494" text-anchor="middle" class="lb">telemetry: tokens, tool calls, subagents</text><path d="M105,415 L105,553 L523,553" class="ln ds" marker-end="url(#ah)"/><text x="314" y="547" text-anchor="middle" class="lb">contract events: lifecycle (+ usage for other agents)</text></svg>
