<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 541" width="804" height="541" role="img" aria-label="Attempt state machine as derived by normalize"><style>
svg{--foreground:#1d1d1f;--muted:#5f6368;--background:#ffffff;--card:#f4f4f5;--border:#c9c9cf;
--chart-1:#3b6fe0;--chart-2:#17a2a2;--chart-3:#d99a06;--chart-4:#8b5cf6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){svg{--foreground:#ececef;--muted:#a1a1aa;--background:#0d1117;--card:#1b1f27;--border:#3a3f4b}}
.bg{fill:var(--background)}
text{fill:var(--foreground)}
.b{font-size:12px;font-weight:600}.s{font-size:10.5px;fill:var(--muted)}
.lb{font-size:10.5px;fill:var(--foreground);paint-order:stroke;stroke:var(--background);stroke-width:4px;stroke-linejoin:round}
.zt{font-size:11px;font-weight:600;fill:var(--muted);letter-spacing:.02em}
.zone{fill:none;stroke:var(--border);stroke-dasharray:3 3}
.ln{fill:none;stroke:var(--muted);stroke-width:1.3}.ds{stroke-dasharray:5 4}
.ahd{fill:var(--muted)}
.p0{fill:var(--card);stroke:var(--border)}
.p1{fill:color-mix(in srgb,var(--chart-1) 18%,var(--background));stroke:var(--chart-1)}
.p2{fill:color-mix(in srgb,var(--chart-2) 18%,var(--background));stroke:var(--chart-2)}
.p3{fill:color-mix(in srgb,var(--chart-3) 18%,var(--background));stroke:var(--chart-3)}
.p4{fill:color-mix(in srgb,var(--chart-4) 18%,var(--background));stroke:var(--chart-4)}
.life{stroke:var(--border);stroke-dasharray:2 3}
.grp{fill:none;stroke:var(--border)}.gl{stroke:var(--border);stroke-dasharray:4 3}
.gk{font-size:10.5px;font-weight:600;fill:var(--muted)}
.note{fill:color-mix(in srgb,var(--chart-4) 18%,var(--background));stroke:var(--chart-4)}
.th{font-size:12px;font-weight:700}.tc{font-size:10.5px;font-family:ui-monospace,Menlo,monospace}
.tt{font-size:10px;fill:var(--muted);font-family:ui-monospace,Menlo,monospace}
.pk{fill:var(--chart-3);font-size:10px;font-weight:700}.fk{fill:var(--chart-1);font-size:10px;font-weight:700}
.sep{stroke:var(--border)}
.lg{font-size:11px;fill:var(--muted)}
</style><rect class="bg" width="804" height="541"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahd"/></marker></defs><rect x="8" y="7" width="10" height="10" rx="2" class="p4"/><text x="23" y="16" class="lg">attempts.state</text><rect x="127.8" y="7" width="10" height="10" rx="2" class="p3"/><text x="142.8" y="16" class="lg">finished, but a human still has to act</text><text x="396.4" y="16" class="lg">dashed: wait closed by a later event</text><g transform="translate(0,-55)"><circle cx="30" cy="125" r="7" class="ahd"/><path d="M37,125 L98,125" class="ln" marker-end="url(#ah)"/><text x="67" y="117" text-anchor="middle" class="lb">started</text><rect x="100" y="100" width="190" height="50" rx="6" class="p4"/><text x="195.0" y="122.0" text-anchor="middle" class="b">running</text><text x="195.0" y="136.0" text-anchor="middle" class="s">ended_at NULL</text><rect x="510" y="100" width="190" height="50" rx="6" class="p4"/><text x="605.0" y="122.0" text-anchor="middle" class="b">waiting_for_human</text><text x="605.0" y="136.0" text-anchor="middle" class="s">open wait since ts</text><rect x="100" y="300" width="190" height="54" rx="6" class="p4"/><text x="195.0" y="317.0" text-anchor="middle" class="b">completed | failed |</text><text x="195.0" y="331.0" text-anchor="middle" class="s">cancelled</text><text x="195.0" y="345.0" text-anchor="middle" class="s">terminal: ended_at set</text><rect x="510" y="300" width="190" height="54" rx="6" class="p3"/><text x="605.0" y="317.0" text-anchor="middle" class="b">waiting_for_human</text><text x="605.0" y="331.0" text-anchor="middle" class="s">ended_at set,</text><text x="605.0" y="345.0" text-anchor="middle" class="s">status parked</text><path d="M290,115 L508,115" class="ln" marker-end="url(#ah)"/><text x="400" y="109" text-anchor="middle" class="lb">human.waiting · opens the wait</text><path d="M510,138 L292,138" class="ln" marker-end="url(#ah)"/><text x="400" y="168" text-anchor="middle" class="lb">human.resumed · wait_ms += resumed − waiting</text><path d="M195,150 L195,298" class="ln" marker-end="url(#ah)"/><text x="201" y="220" text-anchor="start" class="lb">attempt.finished</text><text x="201" y="234" text-anchor="start" class="lb">→ state = status</text><path d="M605,150 L605,298" class="ln" marker-end="url(#ah)"/><text x="611" y="220" text-anchor="start" class="lb">attempt.finished</text><text x="611" y="234" text-anchor="start" class="lb">while the wait is open</text><path d="M510,327 L292,327" class="ln ds" marker-end="url(#ah)"/><text x="400" y="321" text-anchor="middle" class="lb">human.resumed on it or its child</text><text x="400" y="343" text-anchor="middle" class="lb">→ takes the parked status</text><text x="100" y="376" class="lg">Events of a terminal attempt no longer change its state. Events for an attempt that never started stay in events only.</text><text x="8" y="410" class="zt">plan → build: one wait, two attempts (minutes after 09:00)</text><line x1="150" x2="780" y1="530" y2="530" class="sep"/><line x1="150.0" x2="150.0" y1="530" y2="534" class="sep"/><text x="150.0" y="546" text-anchor="middle" class="tt">0</text><line x1="207.27272727272728" x2="207.27272727272728" y1="530" y2="534" class="sep"/><text x="207.27272727272728" y="546" text-anchor="middle" class="tt">2</text><line x1="264.54545454545456" x2="264.54545454545456" y1="530" y2="534" class="sep"/><text x="264.54545454545456" y="546" text-anchor="middle" class="tt">4</text><line x1="321.8181818181818" x2="321.8181818181818" y1="530" y2="534" class="sep"/><text x="321.8181818181818" y="546" text-anchor="middle" class="tt">6</text><line x1="379.0909090909091" x2="379.0909090909091" y1="530" y2="534" class="sep"/><text x="379.0909090909091" y="546" text-anchor="middle" class="tt">8</text><line x1="436.3636363636364" x2="436.3636363636364" y1="530" y2="534" class="sep"/><text x="436.3636363636364" y="546" text-anchor="middle" class="tt">10</text><line x1="493.6363636363636" x2="493.6363636363636" y1="530" y2="534" class="sep"/><text x="493.6363636363636" y="546" text-anchor="middle" class="tt">12</text><line x1="550.909090909091" x2="550.909090909091" y1="530" y2="534" class="sep"/><text x="550.909090909091" y="546" text-anchor="middle" class="tt">14</text><line x1="608.1818181818182" x2="608.1818181818182" y1="530" y2="534" class="sep"/><text x="608.1818181818182" y="546" text-anchor="middle" class="tt">16</text><line x1="665.4545454545455" x2="665.4545454545455" y1="530" y2="534" class="sep"/><text x="665.4545454545455" y="546" text-anchor="middle" class="tt">18</text><line x1="722.7272727272727" x2="722.7272727272727" y1="530" y2="534" class="sep"/><text x="722.7272727272727" y="546" text-anchor="middle" class="tt">20</text><line x1="780.0" x2="780.0" y1="530" y2="534" class="sep"/><text x="780.0" y="546" text-anchor="middle" class="tt">22</text><text x="8" y="448" class="b">plan p1</text><text x="8" y="462" class="s">role plan</text><text x="8" y="492" class="b">build b1</text><text x="8" y="506" class="s">parent inferred = p1</text><rect x="150.0" y="432" width="85.9090909090909" height="24" rx="4" class="p4"/><text x="192.95454545454544" y="448" text-anchor="middle" class="s">running</text><rect x="235.9090909090909" y="432" width="257.72727272727275" height="24" rx="4" class="p3"/><text x="364.77272727272725" y="448" text-anchor="middle" class="s">waiting_for_human (finished at 4)</text><rect x="493.6363636363636" y="476" width="257.72727272727275" height="24" rx="4" class="p4"/><text x="622.5" y="492" text-anchor="middle" class="s">running → completed at 21</text><path d="M493.6363636363636,456 L493.6363636363636,474" class="ln ds" marker-end="url(#ah)"/><text x="150" y="518" text-anchor="start" class="lb">at 12: human.resumed on b1 closes p1’s wait → p1 completed, b1.human_wait_ms = 9m</text><text x="8" y="570" class="lg">active = elapsed − human_wait_ms. A build without parent_attempt_id is linked to the latest earlier attempt</text><text x="8" y="585" class="lg">of the same factory and work item. Work-item outcome: merged if any linked PR merged, rejected if all closed, else open.</text></g></svg>
