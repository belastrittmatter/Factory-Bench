name: Bug Report
description: Report a wrong metric, a broken report or dashboard view, a rejected event, a crash or a test failure.
title: "[BUG] "
labels: ["type:bug", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: What is failing or showing incorrect data?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Minimal reproduction steps.
      value: |
        1. Build with `go build -o factorybench ./cmd/factorybench`
        2. Run `./factorybench serve` / `dashboard` / `report ...` with `...`
        3. Send event / open page `...`
        4. See error:
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs Actual Behavior
      description: What should happen vs what actually occurred.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Event Payload / Report Output
      description: Paste terminal logs, the event or OTLP payload, or the report output. Strip tokens and prompts.
      render: shell
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What proves this bug is fixed?
      value: |
        - [ ] Root cause identified and resolved
        - [ ] Regression test added to prevent recurrence
    validations:
      required: true
