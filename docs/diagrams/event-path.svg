<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 892" width="804" height="892" role="img" aria-label="One event from factorybench emit to the console"><style>
svg{--foreground:#1d1d1f;--muted:#5f6368;--background:#ffffff;--card:#f4f4f5;--border:#c9c9cf;
--chart-1:#3b6fe0;--chart-2:#17a2a2;--chart-3:#d99a06;--chart-4:#8b5cf6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){svg{--foreground:#ececef;--muted:#a1a1aa;--background:#0d1117;--card:#1b1f27;--border:#3a3f4b}}
.bg{fill:var(--background)}
text{fill:var(--foreground)}
.b{font-size:12px;font-weight:600}.s{font-size:10.5px;fill:var(--muted)}
.lb{font-size:10.5px;fill:var(--foreground);paint-order:stroke;stroke:var(--background);stroke-width:4px;stroke-linejoin:round}
.zt{font-size:11px;font-weight:600;fill:var(--muted);letter-spacing:.02em}
.zone{fill:none;stroke:var(--border);stroke-dasharray:3 3}
.ln{fill:none;stroke:var(--muted);stroke-width:1.3}.ds{stroke-dasharray:5 4}
.ahd{fill:var(--muted)}
.p0{fill:var(--card);stroke:var(--border)}
.p1{fill:color-mix(in srgb,var(--chart-1) 18%,var(--background));stroke:var(--chart-1)}
.p2{fill:color-mix(in srgb,var(--chart-2) 18%,var(--background));stroke:var(--chart-2)}
.p3{fill:color-mix(in srgb,var(--chart-3) 18%,var(--background));stroke:var(--chart-3)}
.p4{fill:color-mix(in srgb,var(--chart-4) 18%,var(--background));stroke:var(--chart-4)}
.life{stroke:var(--border);stroke-dasharray:2 3}
.grp{fill:none;stroke:var(--border)}.gl{stroke:var(--border);stroke-dasharray:4 3}
.gk{font-size:10.5px;font-weight:600;fill:var(--muted)}
.note{fill:color-mix(in srgb,var(--chart-4) 18%,var(--background));stroke:var(--chart-4)}
.th{font-size:12px;font-weight:700}.tc{font-size:10.5px;font-family:ui-monospace,Menlo,monospace}
.tt{font-size:10px;fill:var(--muted);font-family:ui-monospace,Menlo,monospace}
.pk{fill:var(--chart-3);font-size:10px;font-weight:700}.fk{fill:var(--chart-1);font-size:10px;font-weight:700}
.sep{stroke:var(--border)}
.lg{font-size:11px;fill:var(--muted)}
</style><rect class="bg" width="804" height="892"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahd"/></marker></defs><line x1="55" x2="55" y1="38" y2="886" class="life"/><rect x="2" y="8" width="107" height="30" rx="6" class="p2"/><text x="55" y="27" text-anchor="middle" class="b">Factory (emit)</text><line x1="170" x2="170" y1="38" y2="886" class="life"/><rect x="117" y="8" width="107" height="30" rx="6" class="p4"/><text x="170" y="27" text-anchor="middle" class="b">intake</text><line x1="285" x2="285" y1="38" y2="886" class="life"/><rect x="232" y="8" width="107" height="30" rx="6" class="p4"/><text x="285" y="27" text-anchor="middle" class="b">contract</text><line x1="400" x2="400" y1="38" y2="886" class="life"/><rect x="347" y="8" width="107" height="30" rx="6" class="p0"/><text x="400" y="27" text-anchor="middle" class="b">store · SQLite</text><line x1="515" x2="515" y1="38" y2="886" class="life"/><rect x="462" y="8" width="107" height="30" rx="6" class="p4"/><text x="515" y="27" text-anchor="middle" class="b">normalize</text><line x1="630" x2="630" y1="38" y2="886" class="life"/><rect x="577" y="8" width="107" height="30" rx="6" class="p4"/><text x="630" y="27" text-anchor="middle" class="b">report</text><line x1="745" x2="745" y1="38" y2="886" class="life"/><rect x="692" y="8" width="107" height="30" rx="6" class="p1"/><text x="745" y="27" text-anchor="middle" class="b">stdout</text><rect x="22" y="506" width="760" height="162" rx="4" class="grp"/><text x="30" y="519" class="gk">opt [accepted + rejected &gt; 0]</text><rect x="22" y="332" width="760" height="162" rx="4" class="grp"/><text x="30" y="345" class="gk">loop [each event in the batch]</text><rect x="22" y="204" width="760" height="84" rx="4" class="grp"/><text x="30" y="217" class="gk">alt [unknown token · body not a JSON array · &gt; 10 MB]</text><path d="M55,72 L81,72 L81,86 L58,86" class="ln" marker-end="url(#ah)"/><text x="87" y="81" text-anchor="start" class="lb">emit usage --attempt a1 --key usage:1 --json …</text><path d="M55,104 L81,104 L81,118 L58,118" class="ln" marker-end="url(#ah)"/><text x="87" y="113" text-anchor="start" class="lb">envelope: spec, id = a1:usage:1, ts = now</text><path d="M55,140 L168,140" class="ln" marker-end="url(#ah)"/><text x="112.5" y="135" text-anchor="middle" class="lb">POST /v1/events  [event]  Bearer fbt_…</text><path d="M170,166 L398,166" class="ln" marker-end="url(#ah)"/><text x="285.0" y="161" text-anchor="middle" class="lb">FactoryByToken(sha256(token))</text><path d="M400,192 L172,192" class="ln ds" marker-end="url(#ah)"/><text x="285.0" y="187" text-anchor="middle" class="lb">factory_id (never from the body)</text><path d="M170,244 L57,244" class="ln" marker-end="url(#ah)"/><text x="112.5" y="239" text-anchor="middle" class="lb">401 / 400</text><path d="M55,266 L81,266 L81,280 L58,280" class="ln" marker-end="url(#ah)"/><text x="87" y="275" text-anchor="start" class="lb">append to spool.jsonl, exit 0</text><path d="M170,310 L196,310 L196,324 L173,324" class="ln" marker-end="url(#ah)"/><text x="202" y="319" text-anchor="start" class="lb">mu.Lock(): one batch at a time</text><path d="M170,372 L283,372" class="ln" marker-end="url(#ah)"/><text x="227.5" y="367" text-anchor="middle" class="lb">Validate(raw)</text><path d="M285,398 L172,398" class="ln ds" marker-end="url(#ah)"/><text x="227.5" y="393" text-anchor="middle" class="lb">Event, Payload, error</text><path d="M170,424 L398,424" class="ln" marker-end="url(#ah)"/><text x="285.0" y="419" text-anchor="middle" class="lb">InsertEvent(contract, factory, id, type, ts, raw, rejected)</text><path d="M400,446 L426,446 L426,460 L403,460" class="ln" marker-end="url(#ah)"/><text x="432" y="455" text-anchor="start" class="lb">ON CONFLICT: replace only a rejected row</text><path d="M400,482 L172,482" class="ln ds" marker-end="url(#ah)"/><text x="285.0" y="477" text-anchor="middle" class="lb">dup = 0 rows affected</text><path d="M170,546 L513,546" class="ln" marker-end="url(#ah)"/><text x="342.5" y="541" text-anchor="middle" class="lb">after(): normalize.Run(db)</text><path d="M515,572 L402,572" class="ln" marker-end="url(#ah)"/><text x="457.5" y="567" text-anchor="middle" class="lb">BEGIN · DELETE derived tables</text><path d="M515,598 L402,598" class="ln" marker-end="url(#ah)"/><text x="457.5" y="593" text-anchor="middle" class="lb">SELECT accepted events ORDER BY ts</text><path d="M515,620 L541,620 L541,634 L518,634" class="ln" marker-end="url(#ah)"/><text x="547" y="629" text-anchor="start" class="lb">derive(): attempts, waits, prices</text><path d="M515,656 L402,656" class="ln" marker-end="url(#ah)"/><text x="457.5" y="651" text-anchor="middle" class="lb">INSERT derived rows · COMMIT</text><path d="M170,694 L57,694" class="ln" marker-end="url(#ah)"/><text x="112.5" y="689" text-anchor="middle" class="lb">200 {accepted, duplicates, rejected[]}</text><path d="M55,716 L81,716 L81,730 L58,730" class="ln" marker-end="url(#ah)"/><text x="87" y="725" text-anchor="start" class="lb">rejected? log it to stderr (kept in events)</text><path d="M745,752 L632,752" class="ln" marker-end="url(#ah)"/><text x="687.5" y="747" text-anchor="middle" class="lb">$ factorybench report live</text><path d="M630,778 L402,778" class="ln" marker-end="url(#ah)"/><text x="515.0" y="773" text-anchor="middle" class="lb">SELECT attempts running | waiting + usage sums</text><path d="M400,804 L628,804" class="ln ds" marker-end="url(#ah)"/><text x="515.0" y="799" text-anchor="middle" class="lb">rows</text><path d="M630,826 L604,826 L604,840 L627,840" class="ln" marker-end="url(#ah)"/><text x="598" y="835" text-anchor="end" class="lb">elapsed, active = elapsed − wait, cost</text><path d="M630,862 L743,862" class="ln" marker-end="url(#ah)"/><text x="687.5" y="857" text-anchor="middle" class="lb">tabwriter table</text></svg>
