 class="lb">attempt.started (role: plan)</text><path d="M299,154 L419,154" class="ln" marker-end="url(#ah)"/><text x="360.0" y="149" text-anchor="middle" class="lb">red phase: write failing tests</text><path d="M299,180 L663,180" class="ln ds" marker-end="url(#ah)"/><text x="482.0" y="175" text-anchor="middle" class="lb">usage (per session)</text><path d="M299,206 L179,206" class="ln" marker-end="url(#ah)"/><text x="238.0" y="201" text-anchor="middle" class="lb">push, draft PR, agent:plan-review</text><path d="M299,232 L663,232" class="ln ds" marker-end="url(#ah)"/><text x="482.0" y="227" text-anchor="middle" class="lb">pr.linked · human.waiting · attempt.finished</text><path d="M177,258 L663,258" class="ln ds" marker-end="url(#ah)"/><text x="421.0" y="253" text-anchor="middle" class="lb">poll: PR opened, labels</text><path d="M55,284 L175,284" class="ln" marker-end="url(#ah)"/><text x="116.0" y="279" text-anchor="middle" class="lb">label agent:plan-approved</text><path d="M299,310 L663,310" class="ln ds" marker-end="url(#ah)"/><text x="482.0" y="305" text-anchor="middle" class="lb">human.resumed · attempt.started (build, parent=plan)</text><path d="M299,362 L419,362" class="ln" marker-end="url(#ah)"/><text x="360.0" y="357" text-anchor="middle" class="lb">green phase</text><path d="M299,388 L663,388" class="ln ds" marker-end="url(#ah)"/><text x="482.0" y="383" text-anchor="middle" class="lb">usage · activity</text><path d="M299,410 L325,410 L325,424 L302,424" class="ln" marker-end="url(#ah)"/><text x="331" y="419" text-anchor="start" class="lb">gates: build, guard, test, bench budget</text><path d="M299,458 L179,458" class="ln" marker-end="url(#ah)"/><text x="238.0" y="453" text-anchor="middle" class="lb">push, PR ready (or draft + agent:needs-human)</text><path d="M299,484 L663,484" class="ln ds" marker-end="url(#ah)"/><text x="482.0" y="479" text-anchor="middle" class="lb">pr.linked · attempt.finished</text><path d="M177,510 L541,510" class="ln" marker-end="url(#ah)"/><text x="360.0" y="505" text-anchor="middle" class="lb">PR updated</text><path d="M543,532 L517,532 L517,546 L540,546" class="ln" marker-end="url(#ah)"/><text x="511" y="541" text-anchor="end" class="lb">main vs PR, 5 runs each, medians</text><path d="M543,568 L179,568" class="ln" marker-end="url(#ah)"/><text x="360.0" y="563" text-anchor="middle" class="lb">check run: pass / fail</text><path d="M177,594 L663,594" class="ln ds" marker-end="url(#ah)"/><text x="421.0" y="589" text-anchor="middle" class="lb">poll: check runs</text><path d="M55,646 L175,646" class="ln" marker-end="url(#ah)"/><text x="116.0" y="641" text-anchor="middle" class="lb">review, merge</text><path d="M177,672 L663,672" class="ln ds" marker-end="url(#ah)"/><text x="421.0" y="667" text-anchor="middle" class="lb">poll: merged, commit authors</text><path d="M543,698 L179,698" class="ln" marker-end="url(#ah)"/><text x="360.0" y="693" text-anchor="middle" class="lb">bot commits docs/health to main [skip ci]</text><line x1="22" x2="700" y1="710" y2="710" class="gl"/><text x="30" y="723" class="gk">[breaks budget]</text><path d="M543,750 L179,750" class="ln" marker-end="url(#ah)"/><text x="360.0" y="745" text-anchor="middle" class="lb">comment &quot;idle mem 312 MB &gt; 250 MB (main 205)&quot; + perf issue</text><path d="M177,776 L663,776" class="ln ds" marker-end="url(#ah)"/><text x="421.0" y="771" text-anchor="middle" class="lb">new work item, linked as corrective</text><rect x="555" y="808" width="165" height="22" rx="4" class="note"/><text x="638" y="823" text-anchor="middle" class="lb">day 14: reconciler → survival</text></svg>
