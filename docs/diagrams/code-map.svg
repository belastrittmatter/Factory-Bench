<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 534" width="804" height="534" role="img" aria-label="FactoryBench Go packages and how they connect"><style>
svg{--foreground:#1d1d1f;--muted:#5f6368;--background:#ffffff;--card:#f4f4f5;--border:#c9c9cf;
--chart-1:#3b6fe0;--chart-2:#17a2a2;--chart-3:#d99a06;--chart-4:#8b5cf6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){svg{--foreground:#ececef;--muted:#a1a1aa;--background:#0d1117;--card:#1b1f27;--border:#3a3f4b}}
.bg{fill:var(--background)}
text{fill:var(--foreground)}
.b{font-size:12px;font-weight:600}.s{font-size:10.5px;fill:var(--muted)}
.lb{font-size:10.5px;fill:var(--foreground);paint-order:stroke;stroke:var(--background);stroke-width:4px;stroke-linejoin:round}
.zt{font-size:11px;font-weight:600;fill:var(--muted);letter-spacing:.02em}
.zone{fill:none;stroke:var(--border);stroke-dasharray:3 3}
.ln{fill:none;stroke:var(--muted);stroke-width:1.3}.ds{stroke-dasharray:5 4}
.ahd{fill:var(--muted)}
.p0{fill:var(--card);stroke:var(--border)}
.p1{fill:color-mix(in srgb,var(--chart-1) 18%,var(--background));stroke:var(--chart-1)}
.p2{fill:color-mix(in srgb,var(--chart-2) 18%,var(--background));stroke:var(--chart-2)}
.p3{fill:color-mix(in srgb,var(--chart-3) 18%,var(--background));stroke:var(--chart-3)}
.p4{fill:color-mix(in srgb,var(--chart-4) 18%,var(--background));stroke:var(--chart-4)}
.life{stroke:var(--border);stroke-dasharray:2 3}
.grp{fill:none;stroke:var(--border)}.gl{stroke:var(--border);stroke-dasharray:4 3}
.gk{font-size:10.5px;font-weight:600;fill:var(--muted)}
.note{fill:color-mix(in srgb,var(--chart-4) 18%,var(--background));stroke:var(--chart-4)}
.th{font-size:12px;font-weight:700}.tc{font-size:10.5px;font-family:ui-monospace,Menlo,monospace}
.tt{font-size:10px;fill:var(--muted);font-family:ui-monospace,Menlo,monospace}
.pk{fill:var(--chart-3);font-size:10px;font-weight:700}.fk{fill:var(--chart-1);font-size:10px;font-weight:700}
.sep{stroke:var(--border)}
.lg{font-size:11px;fill:var(--muted)}
</style><rect class="bg" width="804" height="534"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahd"/></marker></defs><rect x="8" y="7" width="10" height="10" rx="2" class="p4"/><text x="23" y="16" class="lg">FactoryBench package</text><rect x="165.0" y="7" width="10" height="10" rx="2" class="p2"/><text x="180.0" y="16" class="lg">factory side</text><rect x="272.4" y="7" width="10" height="10" rx="2" class="p1"/><text x="287.4" y="16" class="lg">console</text><rect x="348.79999999999995" y="7" width="10" height="10" rx="2" class="p0"/><text x="363.79999999999995" y="16" class="lg">data / external</text><text x="474.79999999999995" y="16" class="lg">── call / data</text><text x="579.5999999999999" y="16" class="lg">- - - read / callback</text><rect x="8" y="34" width="788" height="48" rx="6" class="p0"/><text x="18" y="51" class="b">cmd/factorybench/main.go</text><text x="190" y="51" class="s">subcommand dispatch only; each subcommand calls one package below</text><text x="67" y="72" text-anchor="middle" class="tc">claude-translate</text><text x="201" y="72" text-anchor="middle" class="tc">emit [--flush]</text><text x="335" y="72" text-anchor="middle" class="tc">serve · reconcile</text><text x="469" y="72" text-anchor="middle" class="tc">factory add → store</text><text x="603" y="72" text-anchor="middle" class="tc">replay</text><text x="737" y="72" text-anchor="middle" class="tc">report live|item|…</text><rect x="8" y="130" width="118" height="54" rx="6" class="p2"/><text x="67.0" y="147.0" text-anchor="middle" class="b">Factory</text><text x="67.0" y="161.0" text-anchor="middle" class="s">any factory or</text><text x="67.0" y="175.0" text-anchor="middle" class="s">scripts/*.sh</text><rect x="8" y="222" width="118" height="40" rx="6" class="p2"/><text x="67.0" y="239.0" text-anchor="middle" class="b">claude -p</text><text x="67.0" y="253.0" text-anchor="middle" class="s">stream-json</text><rect x="8" y="296" width="118" height="54" rx="6" class="p4"/><text x="67.0" y="313.0" text-anchor="middle" class="b">claudecode</text><text x="67.0" y="327.0" text-anchor="middle" class="s">stream → usage +</text><text x="67.0" y="341.0" text-anchor="middle" class="s">finished payloads</text><path d="M67,184 L67,220" class="ln" marker-end="url(#ah)"/><text x="73" y="205" text-anchor="start" class="lb">runs</text><path d="M67,262 L67,294" class="ln" marker-end="url(#ah)"/><path d="M126,330 L134,330 L134,172 L140,172" class="ln" marker-end="url(#ah)"/><path d="M126,148 L140,148" class="ln" marker-end="url(#ah)"/><rect x="142" y="130" width="118" height="54" rx="6" class="p4"/><text x="201.0" y="147.0" text-anchor="middle" class="b">emit</text><text x="201.0" y="161.0" text-anchor="middle" class="s">build envelope, POST,</text><text x="201.0" y="175.0" text-anchor="middle" class="s">never fails the caller</text><rect x="142" y="222" width="118" height="40" rx="6" class="p0"/><text x="201.0" y="239.0" text-anchor="middle" class="b">spool.jsonl</text><text x="201.0" y="253.0" text-anchor="middle" class="s">~/.factorybench/</text><path d="M179,184 L179,220" class="ln ds" marker-end="url(#ah)"/><text x="175" y="206" text-anchor="end" class="lb">POST failed</text><path d="M223,222 L223,186" class="ln ds" marker-end="url(#ah)"/><text x="227" y="206" text-anchor="start" class="lb">--flush</text><rect x="142" y="318" width="118" height="44" rx="6" class="p0"/><text x="201.0" y="337.0" text-anchor="middle" class="b">GitHub REST API</text><text x="201.0" y="351.0" text-anchor="middle" class="s">PRs, commits, checks</text><rect x="276" y="130" width="118" height="62" rx="6" class="p4"/><text x="335.0" y="151.0" text-anchor="middle" class="b">intake</text><text x="335.0" y="165.0" text-anchor="middle" class="s">POST /v1/events</text><text x="335.0" y="179.0" text-anchor="middle" class="s">auth · validate · insert</text><path d="M260,148 L274,148" class="ln" marker-end="url(#ah)"/><rect x="276" y="312" width="118" height="56" rx="6" class="p4"/><text x="335.0" y="330.0" text-anchor="middle" class="b">github</text><text x="335.0" y="344.0" text-anchor="middle" class="s">Reconcile(): poll,</text><text x="335.0" y="358.0" text-anchor="middle" class="s">store as raw events</text><path d="M274,340 L262,340" class="ln" marker-end="url(#ah)"/><rect x="410" y="130" width="118" height="72" rx="6" class="p4"/><text x="469.0" y="149.0" text-anchor="middle" class="b">events</text><text x="469.0" y="163.0" text-anchor="middle" class="s">raw, append-only,</text><text x="469.0" y="177.0" text-anchor="middle" class="s">source of truth,</text><text x="469.0" y="191.0" text-anchor="middle" class="s">PK dedupes resends</text><path d="M394,160 L408,160" class="ln" marker-end="url(#ah)"/><path d="M394,326 L450,326 L450,204" class="ln" marker-end="url(#ah)"/><text x="444" y="270" text-anchor="end" class="lb">INSERT</text><path d="M488,204 L488,354 L396,354" class="ln ds" marker-end="url(#ah)"/><text x="400" y="372" text-anchor="start" class="lb">reads pr.linked URLs</text><rect x="544" y="130" width="118" height="72" rx="6" class="p4"/><text x="603.0" y="149.0" text-anchor="middle" class="b">normalize</text><text x="603.0" y="163.0" text-anchor="middle" class="s">derive(): pure</text><text x="603.0" y="177.0" text-anchor="middle" class="s">Run(): wipe + rebuild</text><text x="603.0" y="191.0" text-anchor="middle" class="s">in one transaction</text><path d="M528,166 L542,166" class="ln" marker-end="url(#ah)"/><rect x="544" y="248" width="118" height="92" rx="6" class="p0"/><text x="603.0" y="270.0" text-anchor="middle" class="b">derived tables</text><text x="603.0" y="284.0" text-anchor="middle" class="s">work_items · attempts</text><text x="603.0" y="298.0" text-anchor="middle" class="s">usage · gates · prs</text><text x="603.0" y="312.0" text-anchor="middle" class="s">checks · reviews</text><text x="603.0" y="326.0" text-anchor="middle" class="s">pr_commits</text><path d="M603,202 L603,246" class="ln" marker-end="url(#ah)"/><text x="609" y="228" text-anchor="start" class="lb">INSERT</text><rect x="678" y="130" width="118" height="72" rx="6" class="p0"/><text x="737.0" y="149.0" text-anchor="middle" class="b">golden tests</text><text x="737.0" y="163.0" text-anchor="middle" class="s">testdata/golden/*</text><text x="737.0" y="177.0" text-anchor="middle" class="s">POST → normalize</text><text x="737.0" y="191.0" text-anchor="middle" class="s">→ report = report.txt</text><rect x="678" y="248" width="118" height="62" rx="6" class="p4"/><text x="737.0" y="269.0" text-anchor="middle" class="b">report</text><text x="737.0" y="283.0" text-anchor="middle" class="s">live · item</text><text x="737.0" y="297.0" text-anchor="middle" class="s">items · factories</text><path d="M662,280 L676,280" class="ln" marker-end="url(#ah)"/><rect x="678" y="350" width="118" height="40" rx="6" class="p1"/><text x="737.0" y="367.0" text-anchor="middle" class="b">stdout</text><text x="737.0" y="381.0" text-anchor="middle" class="s">tabwriter tables</text><path d="M737,310 L737,348" class="ln" marker-end="url(#ah)"/><path d="M335,130 L335,106 L603,106 L603,128" class="ln ds" marker-end="url(#ah)"/><text x="469" y="102" text-anchor="middle" class="lb">after(): normalize.Run once per batch (poll and reconcile call it too)</text><rect x="4" y="414" width="796" height="112" rx="10" class="zone"/><text x="14" y="431" class="zt">shared packages: imported, not a stage</text><rect x="14" y="440" width="250" height="76" rx="6" class="p4"/><text x="139.0" y="461.0" text-anchor="middle" class="b">contract</text><text x="139.0" y="475.0" text-anchor="middle" class="s">Event, Payload, Validate()</text><text x="139.0" y="489.0" text-anchor="middle" class="s">mirrors spec/events.schema.json</text><text x="139.0" y="503.0" text-anchor="middle" class="s">used by intake, emit, normalize</text><rect x="277" y="440" width="250" height="76" rx="6" class="p4"/><text x="402.0" y="461.0" text-anchor="middle" class="b">store</text><text x="402.0" y="475.0" text-anchor="middle" class="s">Open() runs schema.sql (embedded)</text><text x="402.0" y="489.0" text-anchor="middle" class="s">InsertEvent · AddFactory · FactoryByToken</text><text x="402.0" y="503.0" text-anchor="middle" class="s">used by main, intake, emit, github</text><rect x="540" y="440" width="250" height="76" rx="6" class="p4"/><text x="665.0" y="461.0" text-anchor="middle" class="b">pricing</text><text x="665.0" y="475.0" text-anchor="middle" class="s">Estimate() from the newest</text><text x="665.0" y="489.0" text-anchor="middle" class="s">prices/YYYY-MM-DD.json (embedded)</text><text x="665.0" y="503.0" text-anchor="middle" class="s">used by normalize</text></svg>
